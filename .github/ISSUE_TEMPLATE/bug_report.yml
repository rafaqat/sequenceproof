name: Bug report
description: Report a reproducible SequenceProof defect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Include gem, npm, Ruby, Rails, and Node versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command, seed, profile, and a redacted trace when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: sensitive
    attributes:
      label: Sensitive data
      options:
        - label: I removed tokens, cookies, personal data, and application secrets from this report.
          required: true
